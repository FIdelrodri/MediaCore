<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel General - MediaCore</title>
    <link rel="stylesheet" href="/css/tema.css">
    <link rel="stylesheet" href="/css/panel.css">
</head>
<body>

    <div class="Fondo">
        <!-- Barra superior -->
        <div class="barra_superior">
            <img class="logowich_arriba" src="/img/MediacoreLogo.png" alt="MediaCore Logo"> 
            <button id="btnCerrarSesion" class="btn_logout">Cerrar Sesión</button>
        </div>

        <main class="contenido_panel">
            <div class="encabezado_panel">
                <h2>Panel General</h2>
            </div>

            <nav style="width: 100%;">
                <ul class="lista_opciones">
                    <!-- Tarjeta 1: Administración (Solo Rol 1) -->
                    <li class="tarjeta_modulo" data-roles-permitidos="1" style="display: none;">
                        <a href="/administracion" class="boton_modulo">
                            <span class="titulo_tarjeta">Administración</span>
                            <span class="desc_tarjeta">Acceso exclusivo a la gestión del sistema y configuración avanzada de usuarios.</span>
                        </a>
                    </li>

                    <!-- Tarjeta 2: Programas (Roles 1, 2 y 6) -->
                    <li class="tarjeta_modulo" data-roles-permitidos="1,2,6" style="display: none;">
                        <a href="/programas" class="boton_modulo">
                            <span class="titulo_tarjeta">Programas</span>
                            <span class="desc_tarjeta">Consulta y administra los programas del canal.</span>
                        </a>
                    </li>
                
                </ul>
            </nav>
        </main>
    </div>

    <script src="/js/panel.js"></script>
</body>
</html>
