<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="/css/registro.css">
    <link rel="stylesheet" href="/css/tema.css">
</head>
<body>
    
<div class="Fondo">
    <!-- logo -->
    <div class="barra_superior">
        <!-- <img class="logowich_arriba" src="../../imagenes/reallogo.png" alt=""> -->
    </div>
    
    <div class="formulario">
    <h1>Registro de Usuario</h1>

    <!-- AHORA TIENE ID Y CLASE -->
    <div id="Alerta" class="Alerta"></div>
    <br>
    
    <form id="formRegistro">
        <div>
            <label class="nombreUsuario">Nombre de Usuario (Username):</label><br>
            <input type="text" id="nombreUsuario" required maxlength="25">
        </div>
        <br>
        <div>
            <label class="nombre">Nombre:</label><br>
            <input type="text" id="nombre" required maxlength="25">
        </div>
        <br>
        <div>
            <label class="apellido">Apellido:</label><br>
            <input type="text" id="apellido" required maxlength="25">
        </div>
        <br>
        <div>
            <label class="email">Correo electrónico:</label><br>
            <input type="email" id="email" required maxlength="50">
        </div>
        <br>
        <div>
            <label class="contrasena">Contraseña:</label><br>
            <input type="password" id="contrasena" required>
        </div>
        <br>
        <div class="boton">
            <button type="submit">Registrarse</button>
        </div>
    </form>
    </div>

</div>
    <script src="/js/registro.js"></script>
</body>
</html>
